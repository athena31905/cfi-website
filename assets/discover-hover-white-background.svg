<svg
  xmlns="http://www.w3.org/2000/svg"
  width="280"
  height="117"
  viewBox="0 0 280 117"
  role="img"
  aria-label="Discover"
>
  <style>
    .hit-area {
      fill: transparent;
      pointer-events: all;
    }

    .label {
      fill: #161616;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.1px;
    }

    .underline {
      stroke: #161616;
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 420ms cubic-bezier(.22,.61,.36,1);
    }

    .ring-base {
      fill: none;
      stroke: #a9a9a9;
      stroke-width: 2;
    }

    .ring-progress {
      fill: none;
      stroke: #e10600;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 188.5;
      stroke-dashoffset: 188.5;
      transform: rotate(-90deg);
      transform-origin: 220px 54px;
      transition: stroke-dashoffset 560ms cubic-bezier(.22,.61,.36,1);
    }

    .arrow {
      fill: none;
      stroke: #161616;
      stroke-width: 3;
      stroke-linecap: square;
      stroke-linejoin: miter;
      transition:
        transform 360ms cubic-bezier(.22,.61,.36,1),
        stroke 240ms ease;
    }

    svg:hover .ring-progress,
    svg:focus .ring-progress {
      stroke-dashoffset: 0;
    }

    svg:hover .underline,
    svg:focus .underline {
      transform: scaleX(1);
    }

    svg:hover .arrow,
    svg:focus .arrow {
      transform: translateX(2px);
      stroke: #e10600;
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-progress,
      .underline,
      .arrow {
        transition: none;
      }
    }
  </style>

  <rect class="hit-area" x="36" y="20" width="218" height="72" rx="2"/>
  <text class="label" x="58" y="61">DISCOVER</text>
  <line class="underline" x1="58" y1="69" x2="178" y2="69"/>
  <circle class="ring-base" cx="220" cy="54" r="30"/>
  <circle class="ring-progress" cx="220" cy="54" r="30"/>
  <path class="arrow" d="M217.5 44.5 L225 54 L217.5 63.5"/>
</svg>
